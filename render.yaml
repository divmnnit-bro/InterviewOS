# Free preview deployment: a Render API, static frontend and private Postgres database.
# Keep previews off so pull requests never create extra billable resources.
previews:
  generation: "off"

services:
  - type: web
    name: interviewos-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: interviewos-db
          property: connectionString
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: interviewos-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: AI_PROVIDER
        value: deterministic
      - key: AI_API_KEY
        value: ""

  - type: web
    name: interviewos-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: interviewos-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: interviewos-db
    databaseName: interviewos
    user: interviewos
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: []