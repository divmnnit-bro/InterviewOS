[alembic]
script_location = alembic
prepend_sys_path = .
# Zero-padded revision ids sort naturally: 0001, 0002, ...
file_template = %%(rev)s_%%(slug)s

# The database URL is NOT set here. alembic/env.py reads it from app settings
# (DATABASE_URL in .env), so there is a single source of truth.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
